name: Idea
description: Something Audiodiver could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like to do in Audiodiver, and how you do it today.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: An example
      description: A mod, a sound or a moment in game where it would help. Screenshots and sketches are welcome.
