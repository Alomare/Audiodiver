# Uploads each published release to Nexus Mods (https://www.nexusmods.com/helldivers2/mods/18133) as a new version of
# its three files: the installer, the portable ZIP and the Audiodiver Utils ZIP. The mod's version follows, and the
# release text becomes the version's changelog.
#
# Needs the repository secret NEXUSMODS_API_KEY (a Nexus Mods API key; Settings, Secrets and variables, Actions).
# Without it the run stops with a message and nothing is uploaded. Run it by hand from the Actions tab (Run workflow)
# to upload a release that is out already. Drafts and pre-releases are never uploaded. It runs apart from the
# release workflow: a failure here never touches the GitHub release or the updater.
name: Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (for example v1.4.0)
        required: true

permissions:
  contents: read

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NEXUS_MOD_ID: '26280904902357'   # the Unique Mod ID (Files tab, Advanced; not the 18133 in the page address)
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  nexus:
    # a published pre-release (a test build) never goes to Nexus
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the API key is set
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the NEXUSMODS_API_KEY repository secret (Settings, Secrets and variables, Actions) first."
            exit 1
          fi

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::No published release with the tag $TAG. Publish the draft (that runs this workflow by itself), or run it by hand with the tag of a published release."
            exit 1
          fi
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '.isDraft or .isPrerelease')" = false ] \
            || { echo "::error::$TAG is a draft or a pre-release: not uploaded."; exit 1; }
          # tags are v1.4.0, ...; the files are named by the version without the v (app/scripts/release.py)
          VERSION="${TAG#v}"
          SETUP="Audiodiver_${VERSION}_x64-setup.exe"
          PORTABLE="Audiodiver-${VERSION}-portable.zip"
          UTILS="Audiodiver-Utils-${VERSION}-portable.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SETUP" --pattern "$PORTABLE" --pattern "$UTILS"
          for f in "$SETUP" "$PORTABLE" "$UTILS"; do
            test -s "$f" || { echo "::error::$f is missing from the release $TAG."; exit 1; }
          done
          unzip -tq "$PORTABLE" && unzip -tq "$UTILS"
          { echo "VERSION=$VERSION"; echo "SETUP=$SETUP"; echo "PORTABLE=$PORTABLE"; echo "UTILS=$UTILS"; } >> "$GITHUB_ENV"

      - name: Changelog from the release text
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          # Nexus shows each changelog line as a point of its own: the section headings (Highlights, Additions...)
          # go, a highlight's title leads its paragraph, and list marks, bold and link targets go
          python3 - <<'PY' > notes.txt
          import re
          out, title = [], None
          for line in open("body.md", encoding="utf-8").read().replace("\r", "").split("\n"):
              line = line.strip()
              if not line or line.startswith("### "):
                  continue
              if line.startswith("#### "):
                  title = line[5:].strip()
                  continue
              line = re.sub(r"^[-*]\s+", "", line)
              line = re.sub(r"\*\*(.+?)\*\*", r"\1", line)
              line = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", line)
              if title:
                  line, title = f"{title}: {line}", None
              out.append(line)
          print("\n".join(out))
          PY
          test -s notes.txt || echo "Version ${VERSION}." > notes.txt
          { echo 'text<<NOTES_END'; cat notes.txt; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"

      # one step per file, each a new version of the file already on the page (Files tab, Advanced, API File ID).
      # The installer is the main download and carries the mod's version and the changelog; the names, the
      # descriptions and the categories are those on the page
      - name: Upload Audiodiver Setup
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8245731'
          filename: ${{ env.SETUP }}
          version: ${{ env.VERSION }}
          display_name: Audiodiver Setup
          description: Windows setup. Install like any other program. Can update from within the app.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          update_mod_version: true
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ steps.notes.outputs.text }}

      - name: Upload Audiodiver Portable
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8245734'
          filename: ${{ env.PORTABLE }}
          version: ${{ env.VERSION }}
          display_name: Audiodiver Portable
          description: All associated files stay within the .exe folder. Must update manually.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true

      - name: Upload Audiodiver Utils Portable
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8245737'
          filename: ${{ env.UTILS }}
          version: ${{ env.VERSION }}
          display_name: Audiodiver Utils Portable
          description: Only the Repatch and Combine tools.
          category: miscellaneous
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
