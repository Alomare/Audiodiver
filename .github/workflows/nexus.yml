# Uploads a release's installer to Nexus Mods (https://www.nexusmods.com/helldivers2/mods/18133) as a new version of
# the Setup file. The mod's version follows, and the release text becomes the version's changelog.
# Nexus holds every new file for a manual review, so this runs only by hand (Actions tab, Run workflow), never on each
# release: the installed app updates itself from GitHub, so the Setup on Nexus can stay a few versions behind. The
# portable ZIPs are on GitHub only.
#
# Needs the repository secret NEXUSMODS_API_KEY (a Nexus Mods API key; Settings, Secrets and variables, Actions).
# Without it the run stops with a message and nothing is uploaded. Drafts and pre-releases are never uploaded.
# Never run it with debug logging on: the upload action writes the API key into the debug log. GitHub masks it, but
# the logs of a public repository are open to anyone.
name: Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (for example v1.4.0)
        required: true

permissions:
  contents: read

concurrency:
  group: nexus-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NEXUS_MOD_ID: '26280904902357'   # the Unique Mod ID (Files tab, Advanced; not the 18133 in the page address)
  TAG: ${{ inputs.tag }}

jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - name: Check the API key is set
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the NEXUSMODS_API_KEY repository secret (Settings, Secrets and variables, Actions) first."
            exit 1
          fi

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::No published release with the tag $TAG. Publish the draft first."
            exit 1
          fi
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '.isDraft or .isPrerelease')" = false ] \
            || { echo "::error::$TAG is a draft or a pre-release: not uploaded."; exit 1; }
          # tags are v1.4.0, ...; the files are named by the version without the v (app/scripts/release.py)
          VERSION="${TAG#v}"
          SETUP="Audiodiver_${VERSION}_x64-setup.exe"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SETUP"
          test -s "$SETUP" || { echo "::error::$SETUP is missing from the release $TAG."; exit 1; }
          { echo "VERSION=$VERSION"; echo "SETUP=$SETUP"; } >> "$GITHUB_ENV"

      - name: Changelog from the release text
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          # Nexus shows each changelog line as a point of its own: the section headings (Highlights, Additions...)
          # go, a highlight's title leads its paragraph, and list marks, bold and link targets go
          python3 - <<'PY' > notes.txt
          import re
          out, title = [], None
          for line in open("body.md", encoding="utf-8").read().replace("\r", "").split("\n"):
              line = line.strip()
              if not line or line.startswith("### "):
                  continue
              if line.startswith("#### "):
                  title = line[5:].strip()
                  continue
              line = re.sub(r"^[-*]\s+", "", line)
              line = re.sub(r"\*\*(.+?)\*\*", r"\1", line)
              line = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", line)
              if title:
                  line, title = f"{title}: {line}", None
              out.append(line)
          print("\n".join(out))
          PY
          test -s notes.txt || echo "Version ${VERSION}." > notes.txt
          { echo 'text<<NOTES_END'; cat notes.txt; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"

      # a new version of the Setup file already on the page (Files tab, Advanced, API File ID); it carries the mod's
      # version and the changelog, and the name, the description and the category are those on the page. The action gets the API key, so it is pinned to the
      # commit of the tag v1.0.0-beta.11 (a tag can be moved); a new version of the action means a new commit here
      - name: Upload Audiodiver Setup
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2  # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8245731'
          filename: ${{ env.SETUP }}
          version: ${{ env.VERSION }}
          display_name: Audiodiver Setup
          description: Windows setup. Install like any other program. Can update from within the app.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          update_mod_version: true
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ steps.notes.outputs.text }}

