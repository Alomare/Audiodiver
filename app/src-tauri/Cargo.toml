[package]
name = "audiodiver"
version = "1.2.0"
description = "Audiodiver: Helldivers 2 audio mod editor"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Alomare/Audiodiver"

[lib]
name = "audiodiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# the check for the WebView2 Runtime before the window opens (both are in the tree already, through wry and the
# dialog plugin, at these versions and features)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
